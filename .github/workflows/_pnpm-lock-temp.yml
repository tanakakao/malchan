name: Generate pnpm lockfile

on:
  push:
    branches:
      - agent/migrate-web-to-pnpm
    paths:
      - "frontend/package.json"
      - "frontend/pnpm-workspace.yaml"
      - ".github/workflows/_pnpm-lock-temp.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          package-json-file: frontend/package.json
          runtime: node@24
          install: false
      - name: Generate lockfile
        working-directory: frontend
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/pnpm-lock.yaml
          git diff --cached --quiet || git commit -m "Generate pnpm lockfile"
          git push
