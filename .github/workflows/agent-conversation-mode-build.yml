name: Agent conversation mode build

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/agent-conversation-mode-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm run test:conversation-mode
      - run: npm run test:plotly-layout
      - run: npm run build
